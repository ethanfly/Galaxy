<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Galaxy Terminal mark — Grok-style singularity / spiral galaxy -->
  <rect width="256" height="256" fill="#05070f"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#c8c0ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="40" y1="40" x2="220" y2="210">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e8e6ff"/>
      <stop offset="100%" stop-color="#b0a8d8"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="url(#glow)"/>
  <!-- Outer accretion spiral -->
  <path
    fill="url(#disk)"
    d="M128 38c49.7 0 90 40.3 90 90 0 28-12.8 53-33 69.5 8.5-11 13.5-24.5 13.5-39.5 0-36.5-29.5-66-66-66s-66 29.5-66 66 29.5 66 66 66c8.2 0 16-1.5 23.3-4.2C142 227 135 228.5 128 228.5c-55.5 0-100.5-45-100.5-100.5S72.5 27.5 128 27.5c14.8 0 28.8 3.2 41.4 9-12.6-1-25.5-1.5-41.4 1.5z"
    opacity="0.95"
  />
  <!-- Bright inner ring -->
  <path
    fill="#ffffff"
    d="M128 58c38.7 0 70 31.3 70 70 0 18.5-7.2 35.3-19 47.8 5.2-8.2 8.2-17.8 8.2-28.3 0-29.3-23.7-53-53-53s-53 23.7-53 53 23.7 53 53 53c6.5 0 12.7-1.2 18.5-3.3-7.2 5.5-16 8.8-25.5 8.8-35.3 0-64-28.7-64-64s28.7-64 64-64c8.5 0 16.6 1.7 24 4.7-7.5-1.2-15.5-2.2-24-1.2z"
  />
  <!-- Event horizon -->
  <circle cx="128" cy="128" r="36" fill="#05070f"/>
  <!-- G-tail spiral arm -->
  <path
    fill="#ffffff"
    d="M168 148c8 18 28 28 48 26-14 2-28-2-38-12-6-6-10-14-12-22-1 4-1 6 2 8z"
    opacity="0.9"
  />
  <path
    fill="#d8d4f0"
    d="M152 138c4 14 16 26 34 32-12-2-22-10-28-20-3-5-5-10-6-12z"
    opacity="0.85"
  />
</svg>

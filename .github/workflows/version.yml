name: Version & Tag

# Bump semver, push tag vX.Y.Z, then immediately run the Windows release build
# in this same workflow (GITHUB_TOKEN cannot chain-trigger other workflows on tag push).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Only print next version (no commit/tag/build)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1) Bump version + create tag on Ubuntu (fast) ───────────────────
  bump:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.next }}
      tag: ${{ steps.ver.outputs.tag }}
      skipped: ${{ steps.ver.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version
        id: ver
        run: |
          CURRENT=$(node scripts/bump-version.mjs)
          NEXT=$(node -e "
            const [a,b,c]='$CURRENT'.split('.').map(Number);
            const k='${{ inputs.bump }}';
            let n = k==='major' ? [a+1,0,0] : k==='minor' ? [a,b+1,0] : [a,b,c+1];
            console.log(n.join('.'));
          ")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "Tag v$NEXT already exists"
            exit 1
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Current: $CURRENT → Next: $NEXT (${{ inputs.bump }})"

      - name: Apply, commit, tag, push
        if: ${{ inputs.dry_run == false }}
        run: |
          node scripts/bump-version.mjs ${{ inputs.bump }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          [ -f src-tauri/Cargo.lock ] && git add src-tauri/Cargo.lock || true
          git commit -m "chore(release): v${{ steps.ver.outputs.next }}"
          git tag "v${{ steps.ver.outputs.next }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.ver.outputs.next }}"

      - name: Summary
        run: |
          {
            echo "### Version"
            echo ""
            echo "- **${{ steps.ver.outputs.current }}** → **${{ steps.ver.outputs.next }}** (\`${{ inputs.bump }}\`)"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "- Dry run — no tag / build"
            else
              echo "- Tag \`v${{ steps.ver.outputs.next }}\` pushed; Windows release job starts next"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2) Windows build + GitHub Release (same workflow = reliable) ───
  release:
    name: Build Windows & publish Release
    needs: bump
    if: ${{ needs.bump.outputs.skipped == 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Align version files to tag
        shell: pwsh
        run: node scripts/bump-version.mjs ${{ needs.bump.outputs.version }}

      - name: Enable updater when secrets present
        shell: pwsh
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBKEY)) {
            Write-Host "No TAURI_UPDATER_PUBKEY — updater disabled"
            exit 0
          }
          $cfg = (Get-Content src-tauri/tauri.conf.json -Raw) | ConvertFrom-Json
          $cfg.plugins.updater.active = $true
          $cfg.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBKEY
          $cfg.bundle.createUpdaterArtifacts = $true
          ($cfg | ConvertTo-Json -Depth 40) | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Test gate
        shell: pwsh
        run: |
          npm test
          Push-Location src-tauri
          cargo test --locked
          Pop-Location

      - name: Build app + NSIS
        # First `--` ends npm args; second `--` forwards the rest to cargo.
        run: npm run tauri build -- -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Code sign (optional)
        shell: pwsh
        env:
          SM_CERT_BASE64: ${{ secrets.SM_CERTIFICATE_BASE64 }}
          SM_CERT_PASS: ${{ secrets.SM_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SM_CERT_BASE64)) {
            Write-Host "No signing cert — skip"
            exit 0
          }
          $cert = Join-Path $env:RUNNER_TEMP "gt-cert.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SM_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool not found" }
          $targets = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          if (Test-Path "src-tauri/target/release/galaxy-terminal.exe") {
            $targets += Get-Item "src-tauri/target/release/galaxy-terminal.exe"
          }
          foreach ($exe in $targets) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $cert /p $env:SM_CERT_PASS $exe.FullName
            & $signtool verify /pa $exe.FullName
          }

      - name: Licenses
        run: npm run gen:licenses
        continue-on-error: true

      - name: Checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle"
          Push-Location $dir
          Get-ChildItem -Recurse -Include *.exe,*.msi,*.sig -ErrorAction SilentlyContinue |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path.Substring((Get-Location).Path.Length + 1))" } |
            Set-Content SHA256SUMS.txt -Encoding utf8
          Pop-Location

      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ needs.bump.outputs.version }}"
          @"
          ## Galaxy Terminal v$v

          ### Install
          Download the NSIS installer (``*-setup.exe``) and run it (per-user, no admin required).

          ### Artifacts
          - Windows x64 NSIS setup
          - ``SHA256SUMS.txt``
          - Docs (CHANGELOG / PRIVACY / RELEASE / licenses)

          Published automatically by **Version & Tag** workflow.
          "@ | Set-Content release-body.md -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: Galaxy Terminal ${{ needs.bump.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/SHA256SUMS.txt
            docs/THIRD_PARTY_LICENSES.md
            docs/PRIVACY.md
            docs/CHANGELOG.md
            docs/RELEASE.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: release

# Clean-VM reproducible build + sign + NSIS + updater manifest (docs/RELEASE.md).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sign-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Enable updater for release (inject pubkey from CI secret)
        shell: pwsh
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cfg.plugins.updater.active = $true
          $cfg.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBKEY
          $cfg.bundle.createUpdaterArtifacts = $true
          $cfg | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Code sign tool bootstrap
        shell: pwsh
        env:
          SM_CERT_BASE64: ${{ secrets.SM_CERTIFICATE_BASE64 }}
          SM_CERT_PASS: ${{ secrets.SM_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:SM_CERT_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/gt-cert.pfx", $bytes)
          echo "cert staged"

      - name: Full test gate before build
        run: |
          npm test
          cargo test --locked
        working-directory: src-tauri
        shell: pwsh

      - name: Build app + NSIS + updater artifacts
        run: npm run tauri build -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign binaries with signtool
        shell: pwsh
        env:
          SM_CERT_PASS: ${{ secrets.SM_CERTIFICATE_PASSWORD }}
        run: |
          $cert = "$env:RUNNER_TEMP/gt-cert.pfx"
          $exes = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $exes += Get-Item src-tauri/target/release/galaxy-terminal.exe
          foreach ($exe in $exes) {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $cert /p $env:SM_CERT_PASS $exe.FullName
            & signtool verify /pa $exe.FullName
          }

      - name: Generate license manifest
        run: npm run gen:licenses

      - name: Checksums
        shell: pwsh
        run: |
          Push-Location src-tauri/target/release/bundle
          Get-ChildItem -Recurse *.exe, *.msi, *.sig | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path | Resolve-Path -Relative)" } |
            Set-Content SHA256SUMS.txt -Encoding utf8
          Pop-Location

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/SHA256SUMS.txt
            docs/THIRD_PARTY_LICENSES.md
            docs/PRIVACY.md
            docs/CHANGELOG.md
            docs/RELEASE.md
          generateReleaseNotes: true

  clean-vm-smoke:
    # Secondary gate: install/upgrade/uninstall on a pristine runner image.
    runs-on: windows-latest
    needs: build-sign-release
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — clean VM acceptance script (docs/RELEASE.md §7)
        run: echo "Execute scripted install/upgrade/uninstall matrix here."

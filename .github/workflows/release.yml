name: Release

# Builds Windows NSIS + publishes GitHub Release when a version tag is pushed.
# Prefer using "Version & Tag" (includes build). Use this for tags created locally:
#   git tag v0.1.1 && git push origin v0.1.1

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish
    runs-on: windows-latest
    # Skip if Version & Tag already published this tag in the same minute (best-effort).
    # Safe to re-run: softprops updates the release.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm ci

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag must be vX.Y.Z, got $tag" }
          $v = $Matches[1]
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          node scripts/bump-version.mjs $v
          Write-Host "Building $tag"

      - name: Enable updater when secrets present
        shell: pwsh
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBKEY)) {
            Write-Host "Updater disabled (no pubkey secret)"
            exit 0
          }
          $cfg = (Get-Content src-tauri/tauri.conf.json -Raw) | ConvertFrom-Json
          $cfg.plugins.updater.active = $true
          $cfg.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBKEY
          $cfg.bundle.createUpdaterArtifacts = $true
          ($cfg | ConvertTo-Json -Depth 40) | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Test gate
        shell: pwsh
        run: |
          npm test
          Push-Location src-tauri
          cargo test --locked
          Pop-Location

      - name: Build app + NSIS
        run: npm run tauri build -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Code sign (optional)
        shell: pwsh
        env:
          SM_CERT_BASE64: ${{ secrets.SM_CERTIFICATE_BASE64 }}
          SM_CERT_PASS: ${{ secrets.SM_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SM_CERT_BASE64)) {
            Write-Host "No signing cert — skip"
            exit 0
          }
          $cert = Join-Path $env:RUNNER_TEMP "gt-cert.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SM_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool not found" }
          $targets = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          if (Test-Path "src-tauri/target/release/galaxy-terminal.exe") {
            $targets += Get-Item "src-tauri/target/release/galaxy-terminal.exe"
          }
          foreach ($exe in $targets) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $cert /p $env:SM_CERT_PASS $exe.FullName
            & $signtool verify /pa $exe.FullName
          }

      - name: Licenses
        run: npm run gen:licenses
        continue-on-error: true

      - name: Checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle"
          Push-Location $dir
          Get-ChildItem -Recurse -Include *.exe,*.msi,*.sig -ErrorAction SilentlyContinue |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path.Substring((Get-Location).Path.Length + 1))" } |
            Set-Content SHA256SUMS.txt -Encoding utf8
          Pop-Location

      - name: Release notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          @"
          ## Galaxy Terminal v$v

          ### Install
          Download the NSIS installer (``*-setup.exe``) and run it (per-user, no admin required).

          Built automatically on tag ``${{ steps.ver.outputs.tag }}``.
          "@ | Set-Content release-body.md -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Galaxy Terminal ${{ steps.ver.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/SHA256SUMS.txt
            docs/THIRD_PARTY_LICENSES.md
            docs/PRIVACY.md
            docs/CHANGELOG.md
            docs/RELEASE.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
